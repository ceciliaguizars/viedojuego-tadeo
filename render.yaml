services:
  - type: web
    name: el-dia-de-tadeo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tadeo-postgres
          property: connectionString
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STALE_SESSION_MINUTES
        value: "30"

databases:
  - name: tadeo-postgres
    plan: free
    databaseName: tadeo
    user: tadeo
    ipAllowList: []
