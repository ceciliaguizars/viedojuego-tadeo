services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tadeo
      POSTGRES_USER: tadeo
      POSTGRES_PASSWORD: tadeo
    ports:
      - "5432:5432"
    volumes:
      - tadeo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadeo -d tadeo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tadeo_postgres_data:

